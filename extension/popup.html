<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Formly Citizen Autofill Assistant</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
      color: #f8fafc;
    }
    .sub {
      font-size: 11px;
      color: #34d399;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sub.offline {
      color: #f59e0b;
    }
    .vault-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .vault-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .sync-btn {
      background: #334155;
      color: #38bdf8;
      border: none;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .sync-btn:hover {
      background: #475569;
    }
    .field-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 3px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .field-row:last-child {
      border-bottom: none;
    }
    .field-label {
      color: #94a3b8;
    }
    .field-val {
      color: #f1f5f9;
      font-weight: 600;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      margin-bottom: 8px;
      transition: transform 0.1s ease;
    }
    .btn-main:active {
      transform: scale(0.98);
    }
    .btn-sec {
      width: 100%;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn-sec:hover {
      background: #334155;
    }
    .notice {
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">🤖</div>
    <div>
      <div class="title">Formly Citizen Autofill Assistant</div>
      <div id="vault-status" class="sub">● Checking Vault...</div>
    </div>
  </div>

  <div class="vault-card">
    <div class="vault-header">
      <span>Active Citizen Profile</span>
      <button id="btn-sync" class="sync-btn">🔄 Sync Vault</button>
    </div>
    <div id="profile-fields-list">
      <div class="field-row">
        <span class="field-label">Applicant Name:</span>
        <span id="p-name" class="field-val">Loading...</span>
      </div>
      <div class="field-row">
        <span class="field-label">Date of Birth:</span>
        <span id="p-dob" class="field-val">—</span>
      </div>
      <div class="field-row">
        <span class="field-label">Aadhaar UID:</span>
        <span id="p-aadhaar" class="field-val">—</span>
      </div>
      <div class="field-row">
        <span class="field-label">Mobile Number:</span>
        <span id="p-mobile" class="field-val">—</span>
      </div>
      <div class="field-row">
        <span class="field-label">Bank Account:</span>
        <span id="p-bank" class="field-val">—</span>
      </div>
    </div>
  </div>

  <button id="btn-autofill" class="btn-main">
    <span>⚡</span>
    <span>AUTOFILL CURRENT PAGE</span>
  </button>

  <button id="btn-open-formly" class="btn-sec">
    Open Formly Vault (localhost:3000)
  </button>

  <div class="notice">
    🔒 Uses your verified citizen data. Press <strong>Alt + Shift + F</strong> to autofill any government portal instantly.
  </div>

  <script src="popup.js"></script>
</body>
</html>
