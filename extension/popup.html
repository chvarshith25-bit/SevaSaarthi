<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SevaSaarthi Citizen Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
    }
    .brand-icon svg {
      width: 18px;
      height: 18px;
      color: white;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #ffffff;
      line-height: 1.2;
    }
    .brand-subtitle {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
    }
    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      white-space: nowrap;
    }
    .status-badge.offline {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.3);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Citizen Profile Card */
    .profile-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: #334155;
      color: #818cf8;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(129, 140, 248, 0.2);
    }
    .user-name {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .user-role {
      font-size: 10px;
      color: #34d399;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .sync-btn {
      background: #334155;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .sync-btn:hover {
      background: #475569;
      color: #f8fafc;
    }

    /* Details List */
    .details-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .detail-label {
      color: #94a3b8;
      font-weight: 500;
    }
    .detail-value {
      color: #f1f5f9;
      font-weight: 600;
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Vault Documents Ready Card */
    .vault-strip {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 12px;
      padding: 9px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .vault-strip-left {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #c7d2fe;
      font-weight: 600;
    }
    .vault-count {
      background: #4f46e5;
      color: white;
      font-weight: 800;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 9999px;
    }

    /* Buttons */
    .btn-autofill {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(79, 70, 229, 0.35);
      margin-bottom: 8px;
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }
    .btn-autofill:hover {
      background: linear-gradient(135deg, #4338ca 0%, #2563eb 100%);
      box-shadow: 0 6px 22px rgba(79, 70, 229, 0.5);
    }
    .btn-autofill:active {
      transform: scale(0.98);
    }
    .btn-autofill svg {
      width: 16px;
      height: 16px;
    }

    .btn-secondary-row {
      display: flex;
      gap: 8px;
    }
    .btn-portal {
      flex: 1;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn-portal:hover {
      background: #334155;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Footer Note */
    .footer-note {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .footer-note kbd {
      background: #334155;
      color: #cbd5e1;
      padding: 1px 4px;
      border-radius: 4px;
      font-family: inherit;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <div>
        <div class="brand-title">SevaSaarthi</div>
        <div class="brand-subtitle">Citizen Autofill Assistant</div>
      </div>
    </div>
    <div id="vault-status" class="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">Connected</span>
    </div>
  </div>

  <!-- Profile Card -->
  <div class="profile-card">
    <div class="card-top">
      <div class="user-info">
        <div id="p-avatar" class="user-avatar">CV</div>
        <div>
          <div id="p-name" class="user-name">Chiluveri Varshith</div>
          <div class="user-role">
            <svg width="11" height="11" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
            <span>Verified Citizen</span>
          </div>
        </div>
      </div>
      <button id="btn-sync" class="sync-btn" title="Refresh profile from vault">
        <svg width="10" height="10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        <span>Sync</span>
      </button>
    </div>

    <div class="details-grid">
      <div class="detail-item">
        <span class="detail-label">Date of Birth</span>
        <span id="p-dob" class="detail-value">2003-08-15</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Aadhaar UID</span>
        <span id="p-aadhaar" class="detail-value">•••• •••• 8921</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Mobile</span>
        <span id="p-mobile" class="detail-value">+91 98765 43210</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Bank Account</span>
        <span id="p-bank" class="detail-value">•••• 4821 (SBI)</span>
      </div>
    </div>
  </div>

  <!-- Vault Documents Strip -->
  <div class="vault-strip">
    <div class="vault-strip-left">
      <span>📁</span>
      <span>Verified Vault Documents</span>
    </div>
    <span id="vault-doc-count" class="vault-count">4 Verified</span>
  </div>

  <!-- Actions -->
  <button id="btn-autofill" class="btn-autofill">
    <svg fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"/>
    </svg>
    <span>AUTOFILL & ATTACH DOCUMENTS</span>
  </button>

  <div class="btn-secondary-row">
    <button id="btn-demo-portal" class="btn-portal" title="Open Live Demonstration Government Portal">
      <span>🏛️ Demo Portal</span>
    </button>
    <button id="btn-open-portal" class="btn-portal" title="Open SevaSaarthi Citizen Dashboard">
      <span>👤 My Vault</span>
    </button>
  </div>

  <div class="footer-note">
    <span>Shortcut: <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>F</kbd> to autofill</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
